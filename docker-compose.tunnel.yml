# Backend on your own machine, published through a free Cloudflare quick tunnel (no account, no
# domain, no open ports). Good for demos and testing; for a permanent address use
# docker-compose.prod.yml on a server, or a named Cloudflare tunnel.
#
#   docker compose -f docker-compose.tunnel.yml --env-file deploy.env up -d --build
#   docker compose -f docker-compose.tunnel.yml logs tunnel | grep trycloudflare.com
#
# The public URL is random and CHANGES every time the tunnel container restarts.
name: mock-interview

services:
  api:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?set CLIENT_ORIGIN in deploy.env}
      MONGO_URI: mongodb://mongo:27017/mock_interview
      REDIS_URL: redis://redis:6379
      AI_MODE: ${AI_MODE:-auto}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RUN_WORKERS_INLINE: "true"
      SANDBOX_WORKDIR: /sandbox
      SANDBOX_VOLUME: mock-interview-sandbox
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox:/sandbox
    ports:
      - "127.0.0.1:4000:4000" # local access only; the internet reaches it through the tunnel
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - mongo
      - redis

  tunnel:
    image: cloudflare/cloudflared:latest
    # Deliberately not "unless-stopped": if Cloudflare refuses a new quick tunnel (HTTP 429), an
    # endless restart loop keeps hitting their rate limit and prolongs the block.
    restart: on-failure:2
    # HTTP/2 over TCP instead of the default QUIC (UDP), which drops on many home networks.
    command: tunnel --no-autoupdate --protocol http2 --url http://api:4000
    depends_on:
      api:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
  sandbox:
    name: mock-interview-sandbox
